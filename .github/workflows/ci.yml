name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Verify packaging and syntax
        run: |
          python -m compileall -q src tests
          python -m pip check
          dayz-observe --version
          dayz-observe selftest
      - name: Run offline tests (resource warnings are errors)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  windows-smoke:
    name: Windows / Python ${{ matrix.python-version }} / full offline suite
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package on Windows
        run: python -m pip install -e .
      - name: Run offline synthetic Nitrado end-to-end
        run: |
          dayz-observe --version
          dayz-observe selftest
      - name: Check oversized Windows filesystem identifiers
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_windows_file_identity.py" -v
      - name: Run complete unit suite on Windows
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  macos-smoke:
    name: macOS / Python ${{ matrix.python-version }} / offline suite
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate launcher without serving HTTP
        run: python launcher.py --check
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run synthetic offline Nitrado end-to-end
        run: dayz-observe selftest
      - name: Run full offline unit suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
