name: Community beta report
description: Read-only beta test, no secrets or player data
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: |
        **Privacy warning:** NEVER submit Nitrado tokens, service IDs, IPs, paths, raw ADM/RPT, databases, player/account/device IDs or identifying screenshots.
        Read the beta instructions in docs/COMMUNITY_BETA.md. This is an independent read-only experiment, not live ESP.
  - type: dropdown
    id: round
    attributes:
      label: Test round
      options:
        - A - Offline synthetic demo
        - B - Nitrado metadata-only probe
        - C - Local ADM import and aggregate report
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Outcome
      options:
        - Worked as expected
        - Partial success
        - Failed
    validations:
      required: true
  - type: dropdown
    id: failure
    attributes:
      label: Error category (no raw logs or tracebacks)
      options:
        - None
        - 401
        - 403
        - 404
        - 429
        - Timeout or connectivity
        - Unsupported service
        - Data parsing
        - Dashboard
        - Other
  - type: textarea
    id: report
    attributes:
      label: Optional anonymous --probe or beta-report JSON
      description: Review the generated JSON and do not add other metadata.
      render: json
  - type: textarea
    id: feedback
    attributes:
      label: What worked, failed, or would be useful for admins?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirm privacy
      options:
        - label: I have checked that my report contains no private data, credentials or identifiers.
          required: true
