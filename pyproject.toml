[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-console-observatory"
version = "0.7.0"
description = "Read-only observability and incident review for DayZ Microsoft/Xbox community servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DayZ Console Observatory contributors" }]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
dayz-observe = "dayz_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dayz_observatory = ["web/*"]
